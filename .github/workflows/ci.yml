name: Tests and Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      VIBE_TRADING_RUN_LIVE_E2E: "0"
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-lock.txt
            pyproject.toml
      - name: Install locked runtime and test dependencies
        run: |
          python -m pip install --require-hashes -r requirements-lock.txt
          python -m pip install "pytest>=7,<10" "pytest-socket>=0.7.0"
          python -m pip install --no-deps -e .
          python -m pip check
      - name: Run backend tests and dependency consistency checks
        run: python -m pytest -q agent/tests
      - name: Verify report font resources in the wheel
        run: |
          python -m pip wheel --no-deps --wheel-dir dist .
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          wheels = list(Path("dist").glob("vibe_trading_ai-*.whl"))
          assert len(wheels) == 1, wheels
          with ZipFile(wheels[0]) as wheel:
              for name in ("VibeReportCJK-Regular.ttf", "OFL.txt", "README.md"):
                  resource = f"src/channels/fonts/{name}"
                  assert resource in wheel.namelist(), f"Missing packaged resource: {resource}"
                  assert wheel.read(resource), f"Empty packaged resource: {resource}"
          PY

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "26"]
    defaults:
      run:
        working-directory: frontend
    env:
      NPM_CONFIG_AUDIT: "false"
      NPM_CONFIG_FUND: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Run frontend tests
        run: npm run test:run
      - name: Build production frontend
        run: npm run build
